<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mayor for a Year</title>
  <meta name="description" content="Walk around Navapuram as its mayor, read the town's data, and find out what really causes what.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/game3d.css">
</head>
<body class="mode3d">
  <!-- the 3D town -->
  <div id="stage" aria-label="3D town of Navapuram. Walk with W A S D or arrow keys, or click the ground."></div>

  <!-- heads-up display -->
  <header class="hud">
    <div class="hud-left">
      <a href="#" id="home" class="brand">
        <svg class="seal" viewBox="0 0 40 40" aria-hidden="true">
          <circle cx="20" cy="20" r="18.5" fill="#141c33" stroke="#f4a63a" stroke-width="2"/>
          <circle cx="20" cy="20" r="14.5" fill="none" stroke="#ffc94a" stroke-width="0.8" stroke-dasharray="1.5 1.5"/>
          <polygon points="20,9 30,15 10,15" fill="#ffc94a"/>
          <rect x="11" y="16" width="18" height="2" fill="#ffc94a"/>
          <rect x="12.5" y="19" width="2.2" height="8" fill="#ffc94a"/><rect x="17" y="19" width="2.2" height="8" fill="#ffc94a"/>
          <rect x="21" y="19" width="2.2" height="8" fill="#ffc94a"/><rect x="25.3" y="19" width="2.2" height="8" fill="#ffc94a"/>
          <rect x="10" y="28" width="20" height="2.4" fill="#ffc94a"/>
        </svg>
        Mayor for a Year
      </a>
      <span id="hud-level" class="hud-chip"></span>
      <span id="hud-week" class="hud-chip"></span>
      <span id="hud-money" class="hud-chip money"></span>
      <span id="hud-approval" class="hud-chip"></span>
      <button id="mute" class="hud-chip mute" type="button" aria-label="Sound on">🔊</button>
    </div>
    <div id="topbar-info" class="topbar-info"></div>
  </header>
  <div id="hud-objective" class="objective"></div>
  <canvas id="minimap" width="168" height="168" aria-label="Map of Navapuram"></canvas>
  <button id="prompt" class="prompt" type="button"></button>
  <div class="controls-hint">W A S D / arrows or click the ground to walk · Shift to run · <kbd>J</kbd> case file · drag to look around · scroll to zoom · <kbd>E</kbd> to interact · <a href="classic.html">classic 2D version</a></div>
  <aside id="season" class="season card"></aside>
  <button id="casebtn" class="casebtn" type="button" style="display:none"></button>
  <aside id="casefile" class="casefile card"></aside>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <!-- game screens open as a panel over the town -->
  <div id="overlay" class="overlay">
    <div class="overlay-inner">
      <button id="close3d" class="btn close3d" type="button">✕ Back to town</button>
      <main id="app"><noscript>This game needs JavaScript.</noscript></main>
    </div>
  </div>
  <div id="tip" class="tooltip" role="status"></div>

  <!-- Plain scripts (not ES modules) so the game works when index.html is opened by double-click. -->
  <script src="vendor/three.min.js"></script>
  <script src="js/rng.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/scm/common.js"></script>
  <script src="js/scm/l1_dengue.js"></script>
  <script src="js/scm/l2_clinics.js"></script>
  <script src="js/scm/l3_coaching.js"></script>
  <script src="js/scm/l4_roads.js"></script>
  <script src="js/levels.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/town.js"></script>
  <script src="js/quiz.js"></script>
  <script src="js/log.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/sfx.js"></script>
  <script src="js/world3d.js"></script>
  <script src="js/game3d.js"></script>
</body>
</html>
